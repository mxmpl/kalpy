[build-system]
requires = [
    "scikit-build-core>=1.0.0",
    "pybind11>=3.1.0",
    "setuptools_scm>=10.2.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "kalpy-kaldi"
description = "Pybind11 bindings for Kaldi for use with the Montreal Forced Aligner"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Michael McAuliffe", email = "michael.e.mcauliffe@gmail.com" },
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "numpy>=1.26.4",
    "pynini>=2.1.7",
    "pyyaml>=6.0.3",
    "praatio>=6.0.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-order>=1.5.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["kalpy"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_file = "kalpy/_version.py"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
profile = "black"
known_first_party = [
    "kalpy",
    '_kalpy'
]

[tool.flake8]
max-line-length = 99
extend-ignore = ["D203", "E203", "E251", "E266", "E302", "E305", "E401", "E402", "E501", "F401", "F403", "W503"]
exclude = [".git", "__pycache__", "dist"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-module = false
ignore-property-decorators = false
fail-under = 95
exclude = [
    "tests",
    "build",
    "dist",
    "setup.py",
    "docs"
]
verbose = 100
omit-covered-files = false
quiet = false
generate-badge = "docs/source/_static"
badge-format = "svg"
whitelist-regex = []
ignore-regex = []
color = true


[tool.check-manifest]
ignore = [
    ".deepsource.toml",
    ".readthedocs.yaml",
]

[tool.coverage.run]
source = ["kalpy"]
concurrency = ["multiprocessing"]
branch = true
parallel = true
omit = [
    ".tox/*"
]


[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "pass",
    "if sys.platform",
    "except ImportError:",
    "except KeyboardInterrupt:",
    "except Exception as e:",
    "except Exception:",
    "if call_back",
    "if is_set",
    "if TYPE_CHECKING:",
    "def history_save_handler() -> None:",
    "class ExitHooks(object):",
    "def main() -> None:",
    "if os.path.exists",
    "@abstractmethod",
    'if "MFA_ERROR"',
]
fail_under = 50
