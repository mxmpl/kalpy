version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "mambaforge-4.10"
  jobs:
    install:
      - echo $CONDA_PREFIX
      - export KALDI_ROOT=$CONDA_PREFIX
      - pip install .

sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - htmlzip

conda:
  environment: rtd_environment.yml
