version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "miniforge3-latest"
  jobs:
    install:
      - which python
      - echo $READTHEDOCS_VERSION_TYPE
      - KALDI_ROOT=$(python -c "import sys; print(sys.prefix)") pip install ".[docs]"

sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - htmlzip

conda:
  environment: environment.yml
