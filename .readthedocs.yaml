version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "mambaforge-4.10"

sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - htmlzip

conda:
  environment: rtd_environment.yml

# This part is necessary otherwise the project is not built
python:
   install:
      - method: pip
        path: .
