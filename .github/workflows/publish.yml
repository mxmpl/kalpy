name: Build wheels and publish to PyPI

# Temporarily reduced to the Windows wheels while they are being set up.

on:
  push:
    branches: [ main, pr/wheels-windows ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: wheels win-64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # MSVC, plus the Ninja and CMake bundled with Visual Studio, on PATH
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Keep the dependency build (~25 min) between runs, even failed ones:
      # ExternalProject resumes from the last completed step. Only reused while
      # deps/ is unchanged.
      - name: Restore dependency build
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/kb
            C:/kaldi
          key: deps-win-64-${{ hashFiles('deps/**') }}-${{ github.run_id }}
          restore-keys: deps-win-64-${{ hashFiles('deps/**') }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - name: Save dependency build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            C:/kb
            C:/kaldi
          key: deps-win-64-${{ hashFiles('deps/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-win-64
          path: wheelhouse/*.whl
