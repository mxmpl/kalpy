name: Build wheels and publish to PyPI

# Temporarily reduced to the Windows wheels while they are being set up.

on:
  push:
    branches: [ main, pr/wheels-windows ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: wheels win-64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # MSVC, plus the Ninja and CMake bundled with Visual Studio, on PATH
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-win-64
          path: wheelhouse/*.whl
